name: Release

# Publishes a GitHub release when a tag v* is pushed: vmbench-<tag>.tar.gz and SHA256SUMS, built by
# scripts/build-release.sh after the whole test suite passed. Cutting a release is the maintainer's decision:
# nothing here runs until someone pushes a tag. See docs/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and test only, publish nothing (a tag run with this off republishes that tag)'
        type: boolean
        default: true
      version:
        description: 'Version to stamp when run from a branch (ignored when run from a tag)'
        type: string
        default: v0.0.0-dryrun

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out the version and whether to publish
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then tag=$REF_NAME; else tag=$INPUT_VERSION; fi
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$tag' is not a version like v0.1.0 or v0.1.0-rc.1"; exit 1; }
          publish=false
          if [ "$REF_TYPE" = tag ] && { [ "$EVENT" = push ] || [ "$DRY_RUN" = false ]; }; then publish=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $tag, publish=$publish"

      - name: A release tag must be on main
        if: steps.ver.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::this tag is not on main; merge first, then tag main"; exit 1; }

      - name: Tests (the full suite)
        run: bash tests/run.sh

      - name: Build the tarball and SHA256SUMS
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/build-release.sh "$TAG" --out dist
          bash scripts/build-release.sh "$TAG" --out "$RUNNER_TEMP/again" > /dev/null
          cmp "dist/vmbench-$TAG.tar.gz" "$RUNNER_TEMP/again/vmbench-$TAG.tar.gz"   # reproducible
          (cd dist && sha256sum -c SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.ver.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # only this job can create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist

      - name: Check what is about to be published
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS)
          test -s "dist/vmbench-$TAG.tar.gz"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          flags=()
          case $TAG in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "dist/vmbench-$TAG.tar.gz" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
