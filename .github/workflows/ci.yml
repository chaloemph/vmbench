name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the secret scan reads the whole history, not only the last commit

      - name: Bash syntax
        run: |
          for f in *.sh tests/*.sh; do bash -n "$f" && echo "ok  $f"; done

      - name: ShellCheck (warnings and errors)
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version | sed -n 2p
          shellcheck -S warning *.sh tests/*.sh

      - name: Python syntax
        run: |
          python3 -I -B -c "import ast, sys; [ast.parse(open(f, encoding='utf-8').read(), f) for f in sys.argv[1:]]; print('ok ', *sys.argv[1:])" report.py tests/test_report.py tests/test_ids.py

      - name: Secret scan (gitleaks, full history)
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSL --retry 3 -o "$dir/$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$dir" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --no-banner --verbose .

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]   # x86_64 and aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Machine
        run: |
          uname -srm
          python3 --version
          bash --version | head -1

      - name: Tests
        run: bash tests/run.sh
